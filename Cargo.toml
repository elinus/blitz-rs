[package]
name = "blitz-rs"
version = "0.1.0"
edition = "2024"
description = "Fast concurrent HTTP benchmarking tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elinus/blitz-rs"
readme = "README.md"
keywords = ["http", "benchmark", "load-testing", "cli", "performance"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "blitz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
hdrhistogram = "7.5.4"
indicatif = "0.18.4"
owo-colors = { version = "4.3.0", features = ["supports-color"] }
reqwest = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
toml = "1.1.2"
tokio = { version = "1.52.1", features = ["default", "rt", "rt-multi-thread", "macros", "signal"] }
axum = "0.8.9"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.52.1", features = ["full"] }
